name: Release Tab Completion Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_main:
    name: Verify Tag is on Main Branch
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.check.outputs.is_main }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Check if commit is on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag commit is on main branch."
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag commit is NOT on main branch (feature branch tag). Skipping binary release."
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

  build_binaries:
    name: Build tab_completion (${{ matrix.name }})
    needs: [check_main]
    if: needs.check_main.outputs.is_main == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64-metal
            os: macos-14
            backend: metal
            artifact_name: tab_completion-macos-arm64-metal

          - name: windows-x86_64-cuda-sm86_sm89
            os: windows-2022
            backend: cuda
            artifact_name: tab_completion-windows-x86_64-cuda-sm86_sm89

          - name: linux-x86_64-cuda-sm86_sm89
            os: ubuntu-22.04
            backend: cuda
            artifact_name: tab_completion-linux-x86_64-cuda-sm86_sm89

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master

      # Windows setup
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Set up CUDA flags for MSVC (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        run: |
          echo "NVCC_PREPEND_FLAGS=-allow-unsupported-compiler -Xcompiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" >> $env:GITHUB_ENV

      # Linux setup
      - name: Set up CUDA Toolkit (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.1'
          method: 'network'

      # Configure CMake
      - name: Configure CMake (macOS Metal)
        if: matrix.backend == 'metal'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_METAL=ON

      - name: Configure CMake (Windows CUDA)
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="86;89" `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -Xcompiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

      - name: Configure CMake (Linux CUDA)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="86;89" \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

      # Build Target tab_completion
      - name: Build tab_completion
        run: |
          cmake --build build --target tab_completion --config Release

      # Package Artifacts
      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN_PATH=$(find build -type f -name tab_completion | head -n 1)
          BIN_DIR=$(dirname "$BIN_PATH")
          tar -czvf "dist/${{ matrix.artifact_name }}.tar.gz" -C "$BIN_DIR" tab_completion

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $bin = Get-ChildItem -Path build -Filter "tab_completion.exe" -Recurse | Select-Object -First 1
          Compress-Archive -Path $bin.FullName -DestinationPath "dist\${{ matrix.artifact_name }}.zip"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish_binaries:
    name: Publish Binaries to GitHub Release
    needs: [check_main, build_binaries]
    if: (needs.check_main.outputs.is_main == 'true' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List Release Binaries
        run: ls -la dist/

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
