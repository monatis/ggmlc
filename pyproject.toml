[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggmlc"
version = "0.1.0"
description = "A Neural-Network Compiler Targeting GGML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "nanobind>=2.0.0",
    "transformers>=4.38.0",
    "torchvision>=0.17.0",
    "sentence-transformers>=2.5.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
]

[project.scripts]
ggmlc = "ggmlc.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]
