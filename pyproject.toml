[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ggmlc"
version = "0.2.0"
description = "A multi-framework neural network compiler lowering PyTorch, JAX, Flax, and Keras models to portable, high-performance GGML execution"
authors = [
    { name = "M. Yusuf Sarıgöz", email = "yusufsarigoz@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["compiler", "deep-learning", "ggml", "pytorch", "jax", "flax", "keras", "inference", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2.0",
    "mermaidx>=0.9.0",
]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "keras>=3.0.0",
    "keras-hub>=0.15.0",
    "mermaidx>=0.9.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-copybutton>=0.5.0",
]
all = [
    "torch>=2.2.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "keras>=3.0.0",
    "keras-hub>=0.15.0",
    "transformers>=4.38.0",
    "torchvision>=0.17.0",
    "sentence-transformers>=2.5.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
    "mermaidx>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "nanobind>=2.0.0",
    "scikit-build-core>=0.9.0",
    "torch>=2.2.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "keras>=3.0.0",
    "keras-hub>=0.15.0",
    "transformers>=4.38.0",
    "torchvision>=0.17.0",
    "sentence-transformers>=2.5.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "mermaidx>=0.9.0",
]

[project.scripts]
ggmlc = "ggmlc.cli:main"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["python/ggmlc"]
wheel.exclude = ["include/**", "lib/**", "*.lib", "*.a", "*.h", "*.hpp", "*.pc", "*.cmake"]
cmake.build-type = "Release"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]
markers = [
    "cuda: tests requiring native NVIDIA CUDA GPU hardware and CUDA runtime",
    "slow: slow-running full model or dataset benchmarks",
]
